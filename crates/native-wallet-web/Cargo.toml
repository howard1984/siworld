[package]
name = "siworld-native-wallet-web"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[features]
browser-fixtures = []
wasm-parallel = ["native/parallel", "dep:wasm-bindgen-rayon", "dep:rayon"]

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { package = "siworld-native-wallet-engine", path = "../native-wallet-engine" }
native = { package = "siworld-multi-asset-experiment", path = "../bench-multi-asset", default-features = false }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
blake3 = { version = "1.8.3", features = ["zeroize"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
wallet_core = { package = "siworld-native-wallet-core", path = "../native-wallet-core" }
wasm-bindgen = "=0.2.120"
serde_json = "1"
zeroize = "1.9.1"
wasm-bindgen-rayon = { version = "=1.3.0", optional = true, features = ["no-bundler"] }
rayon = { version = "=1.12.0", optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
