[package]
name = "siworld-native-wallet-web"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
core = { package = "siworld-native-wallet-core", path = "../native-wallet-core" }
wasm-bindgen = "=0.2.120"
serde_json = "1"
zeroize = "1.9.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
