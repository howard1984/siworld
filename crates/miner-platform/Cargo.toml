[workspace]
members = ["."]
resolver = "2"

[package]
name = "siworld-miner-platform"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
description = "Operating-system boundaries for the native command-line miner"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Console"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
