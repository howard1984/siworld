[workspace]
resolver = "2"
members = ["."]

[package]
name = "siworld-native-node"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/howard1984/siworld"
description = "Native V1 engineering chain and network interfaces"

[features]
# Equivalent Rust-only BLAKE3 implementation for cross-target type checks.
portable-hash = ["blake3/pure"]
default = ["parallel"]
parallel = ["native/parallel"]
# Inactive transport qualification. This feature does not enable a listener or
# provide a conversion to the production authenticated-session capability.
hybrid-tls-candidate = ["dep:rustls", "dep:aws-lc-rs", "dep:aws-lc-sys", "dep:futures-rustls", "dep:futures", "dep:futures-timer", "dep:libp2p-core", "dep:rcgen", "dep:x509-parser"]

# Explicit pinned-peer engineering listener; disabled in default builds.
native-p2p = ["hybrid-tls-candidate"]
peer-qualification = ["native-p2p"]
# Explicit private IPC; does not create a public HTTP listener.
wallet-light-gateway = []
# Explicit offline acceptance target, excluded from production packaging.
checkpoint-rejection-acceptance = []
# Explicit real-time pruning-alarm acceptance build; excluded from production packaging.
checkpoint-stale-acceptance = []
# Owner-operated native block/wallet rehearsal. CI must not select this feature.
eng2-rehearsal = []
# Explicit isolated proof-verifier executable; does not enable block admission.
complete-fee-verifier = []
# Explicit owner-operated resident entry point; excluded from CI build features.
eng2-runtime = ["native-p2p"]

[[bin]]
name = "siworld-eng2-genesis"
path = "src/bin/siworld-eng2-genesis.rs"

[[bin]]
name = "siworld-fee-verifier"
path = "src/bin/siworld-fee-verifier.rs"
required-features = ["complete-fee-verifier"]

[[bin]]
name = "siworld-eng2-node"
path = "src/bin/siworld-eng2-node.rs"
required-features = ["eng2-runtime"]

[[bin]]
name = "siworld-eng2-rehearsal"
path = "src/bin/siworld-eng2-rehearsal.rs"
required-features = ["eng2-rehearsal"]

[[bin]]
name = "siworld-checkpoint-stale-runtime"
path = "src/bin/siworld-checkpoint-stale-runtime.rs"
required-features = ["native-p2p", "checkpoint-stale-acceptance"]

[[bin]]
name = "siworld-checkpoint-rejection-acceptance"
path = "src/bin/siworld-checkpoint-rejection-acceptance.rs"
required-features = ["checkpoint-rejection-acceptance"]

[[bin]]
name = "siworld-compact-inspect"
path = "src/bin/siworld-compact-inspect.rs"
required-features = ["wallet-light-gateway"]

[[bin]]
name = "siworld-peer-qualification"
path = "src/bin/siworld-peer-qualification.rs"
required-features = ["peer-qualification"]

[dependencies]
siworld-miner-platform = { path = "../miner-platform" }
native = { package = "siworld-multi-asset-experiment", path = "../bench-multi-asset", default-features = false }
siworld-core = { path = "../core" }
p3-air = "=0.9.0-rc.2"
p3-challenger = "=0.9.0-rc.2"
p3-dft = "=0.9.0-rc.2"
p3-koala-bear = "=0.9.0-rc.2"
rand = { version = "0.10.3", default-features = false, features = ["std_rng", "sys_rng"] }
p3-batch-stark = "=0.9.0-rc.2"
p3-lookup = "=0.9.0-rc.2"
p3-keccak-air = "=0.9.0-rc.2"
p3-field = "=0.9.0-rc.2"
p3-uni-stark = "=0.9.0-rc.2"
p3-commit = "=0.9.0-rc.2"
p3-fri = "=0.9.0-rc.2"
p3-matrix = "=0.9.0-rc.2"
p3-poseidon2-air = "=0.9.0-rc.2"
p3-merkle-tree = "=0.9.0-rc.2"
p3-symmetric = "=0.9.0-rc.2"
p3-recursion = { git = "https://github.com/howard1984/siworld", rev = "d3d15b2b5d1325fb38ebc8979c1cae04b761e71f", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
blake3 = { version = "1.8.3", features = ["zeroize"] }
libcrux-ml-dsa = { version = "=0.0.11", default-features = false, features = ["mldsa65"] }
libcrux-ml-kem = { version = "=0.0.11", default-features = false, features = ["mlkem768"] }
libcrux-sha3 = "=0.0.11"
num-bigint = "=0.4.8"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
sha2 = "=0.10.9"
getrandom = "0.4"
zeroize = "1.9.1"
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
bip39 = { version = "=2.2.2", default-features = false, features = ["std", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
rpassword = "=7.4.0"
redb = "4.4"
rayon = "1.11"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs", "prefer-post-quantum"], optional = true }
aws-lc-rs = { version = "=1.19.0", default-features = false, features = ["prebuilt-nasm"], optional = true }
aws-lc-sys = { version = "=0.47.0", optional = true }
futures-rustls = { version = "=0.26.0", default-features = false, optional = true }
futures = { version = "=0.3.34", optional = true }
futures-timer = { version = "=3.0.3", optional = true }
libp2p-core = { version = "=0.44.0", default-features = false, optional = true }
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "aws_lc_rs"], optional = true }
x509-parser = { version = "=0.18.1", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
float_arithmetic = "deny"

[profile.release]
debug = false
lto = "thin"
codegen-units = 16
