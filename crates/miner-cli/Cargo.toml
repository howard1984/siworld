[workspace]
members = ["."]
resolver = "2"

[package]
name = "siworld-miner-cli"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
description = "Native foreground engineering miner with an explicit custody wizard"

[[bin]]
name = "siworld-miner-worker"
path = "src/main.rs"

[features]
default = ["network"]
network = ["siworld-native-node/native-p2p"]
# Diagnostic build only: mining is rejected when the network feature is absent.
portable-hash = ["siworld-native-node/portable-hash"]

[dependencies]
native = { package = "siworld-multi-asset-experiment", path = "../bench-multi-asset", default-features = false }
siworld-native-node = { path = "../native-node" }
siworld-native-wallet-core = { path = "../native-wallet-core" }
siworld-miner-platform = { path = "../miner-platform" }
serde_json = "1"
sha2 = "=0.10.9"
rpassword = "=7.4.0"
zeroize = "1.9.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
float_arithmetic = "deny"

[profile.release]
lto = "thin"
codegen-units = 16
debug = false
