name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash {0}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Select relevant offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native_economic_accounting: ${{ steps.paths.outputs.native_economic_accounting }}
      offline_fund_keys: ${{ steps.paths.outputs.offline_fund_keys }}
      workspace: ${{ steps.paths.outputs.workspace }}
      bench_plonky3: ${{ steps.paths.outputs.bench_plonky3 }}
      native_multi_asset: ${{ steps.paths.outputs.native_multi_asset }}
      native_transaction: ${{ steps.paths.outputs.native_transaction }}
      native_runtime: ${{ steps.paths.outputs.native_runtime }}
      wallet: ${{ steps.paths.outputs.wallet }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select changed paths
        id: paths
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: python3 scripts/ci-paths.py '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}'

  native-economic-accounting:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native_economic_accounting == 'true') }}
    name: Native economic order and per-wallet conservation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Acquire locked dependencies
        working-directory: .
        run: bash scripts/ci-fetch.sh native-economic-accounting
      - name: Monetary transition and rejection tests
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          cargo test --release --locked -p siworld-core v1_economics::tests::
  offline-fund-keys:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.offline_fund_keys == 'true') }}
    name: Offline fund key custody
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: crates/fund-keytool
      - name: Acquire locked dependencies
        working-directory: .
        run: bash scripts/ci-fetch.sh offline-fund-keys
      - name: Format and lint isolated custody tool
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          cargo fmt --manifest-path crates/fund-keytool/Cargo.toml --check
          cargo clippy --release --locked --manifest-path crates/fund-keytool/Cargo.toml --all-targets -- -D warnings
      - name: Synthetic custody, backup and malformed-file tests
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo test --release --locked --manifest-path crates/fund-keytool/Cargo.toml
  secrets:
    name: Sensitive information and history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned secret scanner
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          python3 - <<'PY_SCANNER'
          import hashlib
          from pathlib import Path
          expected = '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          assert hashlib.sha256(Path('/tmp/gitleaks.tar.gz').read_bytes()).hexdigest() == expected
          PY_SCANNER
          mkdir /tmp/siworld-scanner
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/siworld-scanner gitleaks
      - name: Scan reachable history with redacted findings
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          /tmp/siworld-scanner/gitleaks git . --log-opts='--all --full-history' \
            --config=.gitleaks.toml --redact=100 --no-banner

  repository:
    name: Repository content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publication manifest and documentation
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          python3 scripts/check-ci-policy.py
          python3 scripts/check-repository.py
          python3 scripts/check-audit-registry.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Explorer projection
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: node --test tools/explorer/tests/projection.test.mjs
  workspace:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.workspace == 'true') }}
    name: Workspace (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Acquire locked dependencies
        working-directory: .
        run: bash scripts/ci-fetch.sh workspace
      - name: Format
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo fmt --all --check
      - name: Default feature isolation
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: python3 scripts/check-node-features.py
      - name: Default binaries
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo check -p siworld-node --bins --locked
      - name: Default proof selection
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo test -p siworld-node --bin siworld-node --locked
      - name: Clippy
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo test --workspace --all-features --locked

  bench-plonky3:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.bench_plonky3 == 'true') }}
    name: STARK benchmark tests (Plonky3)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: crates/bench-stark
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: crates/bench-stark
      - name: Acquire locked dependencies
        working-directory: .
        run: bash scripts/ci-fetch.sh bench-plonky3
      - name: Format
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo fmt --all --check
      - name: Tests
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo test --release --locked -p siworld-bench-plonky3 -p siworld-bench-common
  native-transaction:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native_transaction == 'true') }}
    name: Native D8 transaction relation and codec
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Acquire locked dependencies
        working-directory: .
        run: bash scripts/ci-fetch.sh native-transaction
      - name: Native proof and codec tests
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          cargo fmt --manifest-path crates/bench-d8/Cargo.toml --all --check
          cargo clippy --release --locked --manifest-path crates/bench-d8/Cargo.toml --features security-report --lib --tests -- -D warnings
          native_proof=(--release --locked --manifest-path crates/bench-d8/Cargo.toml --features security-report)
          for relation in transaction encryption fee_settlement fee_settlement_air proof_codec common envelope padding_pool native_verifier native_security; do
            cargo test "${native_proof[@]}" --lib "$relation::tests"
          done
          cargo test "${native_proof[@]}" --lib codec::tests -- --skip proof_codec::tests
          cargo test "${native_proof[@]}" --test snapshots
          cargo test "${native_proof[@]}" --lib proof_codec::tests::candidate_profile_roundtrips_the_actual_transaction_air -- --ignored
          cargo test "${native_proof[@]}" --bin v1-transaction-scan --bin native-verifier-bench
          python3 scripts/check-v1-freeze.py
  native-multi-asset:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native_multi_asset == 'true') }}
    name: Native multi-asset relation and frozen transaction profile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/multi-asset-ci-target
      RAYON_NUM_THREADS: 4
      SIWORLD_COMPOSITION_HIDING_WORKERS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: crates/bench-multi-asset -> ../../.local/multi-asset-ci-target
      - name: Acquire locked dependencies
        working-directory: .
        run: bash scripts/ci-fetch.sh native-multi-asset
      - name: Native proof and public codec tests
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          cargo fmt --manifest-path crates/bench-multi-asset/Cargo.toml --check
          cargo clippy --release --locked --manifest-path crates/bench-multi-asset/Cargo.toml --features security-report --lib --tests -- -D warnings
          cargo test --release --locked --manifest-path crates/bench-multi-asset/Cargo.toml --features security-report --lib --test public_codec_rejections
          python3 scripts/check-native-proof-profiles.py --check crates/bench-multi-asset/artifacts/v1-native-proof-profiles.json
  native-runtime:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native_runtime == 'true') }}
    name: Native protocol and storage unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RAYON_NUM_THREADS: 4
      SIWORLD_COMPOSITION_HIDING_WORKERS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: crates/native-node
      - name: Acquire locked dependencies
        working-directory: .
        run: bash scripts/ci-fetch.sh native-runtime
      - name: Native runtime format and lints
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          cargo fmt --manifest-path crates/native-node/Cargo.toml --check
          cargo clippy --locked --manifest-path crates/native-node/Cargo.toml --features native-p2p,wallet-light-gateway --all-targets -- -D warnings
      - name: Native protocol, transition, persistence and audit rejection tests
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo test --release --locked --manifest-path crates/native-node/Cargo.toml --features native-p2p,wallet-light-gateway
  wallet:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.wallet == 'true') }}
    name: Wallet and WASM offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned toolchain and WASM target
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --target wasm32-unknown-unknown
          rustup run "$toolchain" cargo install --locked --version 0.2.120 wasm-bindgen-cli --bin wasm-bindgen --root "$HOME/.local/siworld-wasm-bindgen"
          echo "$HOME/.local/siworld-wasm-bindgen/bin" >> "$GITHUB_PATH"
      - name: Acquire locked dependencies
        run: bash scripts/ci-fetch.sh wallet
      - name: Wallet unit and browser tests
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          cargo test --locked --manifest-path crates/native-wallet-core/Cargo.toml
          mkdir -p .local/wallet-ci-fixtures
          WALLET_PARITY_OUTPUT="$GITHUB_WORKSPACE/.local/wallet-native-vectors.json" \
            WALLET_PARITY_VAULT="$GITHUB_WORKSPACE/.local/wallet-native-vault.json" \
            cargo test --release --locked --manifest-path crates/native-wallet-core/Cargo.toml --features native-parity --test native_parity
          cargo test --release --locked --manifest-path crates/native-wallet-engine/Cargo.toml
          cargo run --release --locked --manifest-path crates/native-wallet-engine/Cargo.toml --example fixture -- .local/wallet-ci-fixtures
          cargo test --release --locked --manifest-path crates/native-wallet-web/Cargo.toml --lib
          cargo check --locked --target wasm32-unknown-unknown --manifest-path crates/native-wallet-web/Cargo.toml
          python3 crates/native-wallet-web/build.py --browser-fixtures --output .local/wallet-ci --target-dir .local/wallet-ci-target
          WALLET_WEB_OUTPUT="$GITHUB_WORKSPACE/.local/wallet-ci" \
            WALLET_FIXTURE_DIR="$GITHUB_WORKSPACE/.local/wallet-ci-fixtures" \
            WALLET_PARITY_OUTPUT="$GITHUB_WORKSPACE/.local/wallet-native-vectors.json" \
            WALLET_PARITY_VAULT="$GITHUB_WORKSPACE/.local/wallet-native-vault.json" \
            node --test crates/native-wallet-web/tests/*.test.mjs
          node --experimental-vm-modules --test crates/native-wallet-web/offline-receive/protocol.test.mjs crates/native-wallet-web/offline-receive/ui.test.mjs
          python3 crates/native-wallet-web/offline-receive/prepare_test.py
