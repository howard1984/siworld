name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash {0}

env:
  CARGO_TERM_COLOR: always

jobs:
  native-economic-accounting:
    name: Native economic order and per-wallet conservation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Acquire locked dependencies
        working-directory: .
        run: bash scripts/ci-fetch.sh native-economic-accounting
      - name: Current monetary rejection tests and production-schedule simulation
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          cargo test --release --locked -p siworld-core v1_economics::tests::
          mkdir -p .local/native-accounting
          cargo test --release --locked -p siworld-core v1_economics::tests::seeded_twenty_year_modes_preserve_supply_and_curve -- --ignored --exact --nocapture > .local/native-accounting/simulation.log 2>&1
          python3 scripts/check-fund-simulation.py .local/native-accounting/simulation.log .local/native-accounting/simulation.json
      - name: Compare the source-bound numeric reference
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          python3 - <<'PY_ACCOUNTING'
          import hashlib
          import json
          from pathlib import Path
          reference = json.loads(Path('crates/core/artifacts/v1-economics-simulation.json').read_text())
          actual = json.loads(Path('.local/native-accounting/simulation.json').read_text())
          assert reference['simulation'] == actual['simulation'], 'Executed accounting differs from the reference'
          for name, digest in reference['sources_sha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, 'Accounting source differs from the reference'
          PY_ACCOUNTING
  offline-fund-keys:
    name: Offline fund key custody
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: crates/fund-keytool
      - name: Acquire locked dependencies
        working-directory: .
        run: bash scripts/ci-fetch.sh offline-fund-keys
      - name: Format and lint isolated custody tool
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          cargo fmt --manifest-path crates/fund-keytool/Cargo.toml --check
          cargo clippy --release --locked --manifest-path crates/fund-keytool/Cargo.toml --all-targets -- -D warnings
      - name: Synthetic custody, backup and malformed-file tests
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo test --release --locked --manifest-path crates/fund-keytool/Cargo.toml
  secrets:
    name: Sensitive information and history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned secret scanner
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          python3 - <<'PY_SCANNER'
          import hashlib
          from pathlib import Path
          expected = '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          assert hashlib.sha256(Path('/tmp/gitleaks.tar.gz').read_bytes()).hexdigest() == expected
          PY_SCANNER
          mkdir /tmp/siworld-scanner
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/siworld-scanner gitleaks
      - name: Scan reachable history with redacted findings
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          /tmp/siworld-scanner/gitleaks git . --log-opts='--all --full-history' \
            --config=.gitleaks.toml --redact=100 --no-banner

  repository:
    name: Repository content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Browser history-cache and proof-progress contracts
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: node --test crates/native-wallet-web/tests/online-storage.test.mjs crates/native-wallet-web/tests/commitment-session.test.mjs crates/native-wallet-web/tests/proof-progress.test.mjs
      - name: Publication manifest and documentation
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          python3 scripts/check-ci-policy.py
          python3 scripts/check-repository.py
          python3 scripts/check-native-envelope-policy.py
          python3 scripts/check-fee-settlement-evaluation.py --schema >/tmp/fee-settlement-schema.json
      - name: Wallet record selection regressions
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: node --test crates/native-wallet-web/tests/storage-selection.test.mjs
      - name: Shared wallet history regressions
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: node --test crates/native-wallet-web/tests/commitment-session.test.mjs
      - name: Audit evidence and memory declarations
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          python3 scripts/check-audit-registry.py
          python3 scripts/check-memory-budgets.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          python3 -m unittest discover -s tools/control-panel -p 'test_*.py' -v
  workspace:
    name: Workspace (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Acquire locked dependencies
        working-directory: .
        run: bash scripts/ci-fetch.sh workspace
      - name: Format
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo fmt --all --check
      - name: Default feature isolation
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: python3 scripts/check-node-features.py
      - name: Default binaries
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo check -p siworld-node --bins --locked
      - name: Default proof selection
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo test -p siworld-node --bin siworld-node --locked
      - name: Clippy
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo test --workspace --all-features --locked
  bench-plonky3:
    name: STARK benchmark tests (Plonky3)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: crates/bench-stark
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: crates/bench-stark
      - name: Acquire locked dependencies
        working-directory: .
        run: bash scripts/ci-fetch.sh bench-plonky3
      - name: Format
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo fmt --all --check
      - name: Tests
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo test --release --locked -p siworld-bench-plonky3 -p siworld-bench-common
      - name: Isolated composition relation and profiler format
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          cargo test --release --locked -p siworld-bench-plonky3 --features experimental-fanin,phase-profile,security-report --lib
          cargo clippy --release --locked -p siworld-bench-plonky3 --features experimental-fanin,phase-profile,security-report --bin composition-bench -- -D warnings
      - name: D8 scalar geometry rejection tests
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          cargo test --release --locked -p siworld-bench-plonky3 --features d8-geometry --lib d8_geometry::tests
          cargo clippy --release --locked -p siworld-bench-plonky3 --features d8-geometry --lib -- -D warnings
      - name: Conditional D8 planning screen
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          cargo test --release --locked -p siworld-bench-plonky3 --features security-report --bin d8-security-screen
          cargo clippy --release --locked -p siworld-bench-plonky3 --features security-report --bin d8-security-screen -- -D warnings
          cargo run --release --locked -p siworld-bench-plonky3 --features security-report --bin d8-security-screen > /tmp/d8-screen.json
          python3 -c 'import json; r=json.load(open("/tmp/d8-screen.json")); assert len(r["layers"]) == 3; assert all(len(x["candidates"]) == 3 and all(c["screen_pass_conditional_on_shape_and_sites"] and not c["approved"] for c in x["candidates"]) for x in r["layers"])'

  native-transaction:
    name: Native D8 transaction relation and codec
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Acquire locked dependencies
        working-directory: .
        run: bash scripts/ci-fetch.sh native-transaction
      - name: Check CPU before executing optimized tests
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          rustc scripts/prover-launcher.rs --edition=2021 -O -D warnings -C target-cpu=x86-64 -o /tmp/native-cpu-check
          /tmp/native-cpu-check --check-cpu
      - name: Native constraint and encoding rejection tests
        env:
          RAYON_NUM_THREADS: 4
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          cargo fmt --manifest-path crates/bench-d8/Cargo.toml --all --check
          python3 - <<'PY_NATIVE_TEST'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('build_d8', 'scripts/build-d8-checkpoint.py')
          build = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(build)
          command = ['cargo', 'test', '--release', '--manifest-path', '.local/native-transaction/application/Cargo.toml', '--features', 'security-report', '--lib']
          for module, minimum in [('transaction', 8), ('codec', 7), ('encryption', 12), ('fee_settlement', 5), ('fee_settlement_air', 10), ('proof_codec', 14), ('common', 1), ('envelope', 6), ('padding_pool', 1), ('native_verifier', 2), ('native_security', 1)]:
              selected = [*command, module + '::tests']
              if module == 'codec':
                  selected += ['--', '--skip', 'proof_codec::tests']
              build.run_logged(selected, Path('.local/native-transaction') / (module + '-tests.log'), nonempty_tests=True, minimum_tests=minimum)
          build.run_logged([*command[:-1], '--test', 'snapshots'], Path('.local/native-transaction/snapshot-tests.log'), nonempty_tests=True, minimum_tests=15)
          build.run_logged([*command, 'proof_codec::tests::candidate_profile_roundtrips_the_actual_transaction_air', '--', '--ignored'], Path('.local/native-transaction/candidate-codec-test.log'), nonempty_tests=True, minimum_tests=1)
          build.run_logged([*command[:-1], '--bin', 'v1-transaction-scan'], Path('.local/native-transaction/diagnostic-tests.log'), nonempty_tests=True, minimum_tests=2)
          build.run_logged([*command[:-1], '--bin', 'native-verifier-bench'], Path('.local/native-transaction/verifier-worker-tests.log'), nonempty_tests=True, minimum_tests=2)
          PY_NATIVE_TEST
          cargo clippy --release --manifest-path .local/native-transaction/application/Cargo.toml --features security-report --lib --bin v1-transaction-scan --bin native-verifier-bench --bin v1-freeze-artifacts -- -D warnings
          cargo build --release --manifest-path .local/native-transaction/application/Cargo.toml --features security-report --bin v1-transaction-scan --bin v1-freeze-artifacts
          python3 scripts/check-v1-freeze.py
          timeout 600 .local/native-transaction/application/target/release/v1-freeze-artifacts \
            --root "$GITHUB_WORKSPACE" --check crates/bench-d8/artifacts/v1-native-freeze.json
          .local/native-transaction/application/target/release/v1-transaction-scan --security-only --log-blowup 4 --queries 80 --grinding 16 --output .local/native-transaction/security-diagnostic.json
      - name: Preserve registry dependency pins
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          python3 - <<'PY_LOCK'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('build_d8', 'scripts/build-d8-checkpoint.py')
          build = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(build)
          expected = build.registry_pins(Path('crates/bench-d8/Cargo.lock').read_text())
          actual = build.registry_pins(Path('.local/native-transaction/application/Cargo.lock').read_text())
          assert expected == actual, 'Registry pins changed during native validation'
          PY_LOCK

  native-multi-asset:
    name: Native multi-asset relation and frozen transaction profile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/multi-asset-ci-target
      RAYON_NUM_THREADS: 4
      SIWORLD_COMPOSITION_HIDING_WORKERS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: crates/bench-multi-asset -> ../../.local/multi-asset-ci-target
      - name: Acquire locked dependencies
        working-directory: .
        run: bash scripts/ci-fetch.sh native-multi-asset
      - name: Check CPU admission before optimized code
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          rustc scripts/prover-launcher.rs --edition=2021 -O -D warnings -C target-cpu=x86-64 -o /tmp/multi-asset-cpu-check
          /tmp/multi-asset-cpu-check --check-cpu
      - name: Validate native relations and public artifact tooling
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          cargo fmt --manifest-path crates/bench-multi-asset/Cargo.toml --check
          cargo clippy --release --locked --manifest-path crates/bench-multi-asset/Cargo.toml --features security-report --all-targets -- -D warnings
          cargo test --release --locked --manifest-path crates/bench-multi-asset/Cargo.toml --features security-report --lib --bin profile-artifacts --test public_codec_rejections
          rustc --edition=2024 --test crates/bench-multi-asset/src/experiments/transaction_layout.rs -D warnings -o /tmp/transaction-layout-tests
          /tmp/transaction-layout-tests
          cargo build --release --locked --manifest-path crates/bench-multi-asset/Cargo.toml --features security-report --bin profile-artifacts
      - name: Reproduce the frozen transaction public key and security ledger
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          python3 - <<'PY_PROFILE'
          import json
          import os
          from pathlib import Path
          import subprocess
          frozen = Path('crates/bench-multi-asset/artifacts/v1-transaction-profile.json')
          profile = json.loads(frozen.read_text())
          params = profile['parameters']
          output = Path('.local/multi-asset-profile-reproduced.json')
          worker = Path(os.environ['CARGO_TARGET_DIR']) / 'release/profile-artifacts'
          subprocess.run([str(worker), str(params['log_blowup']), str(params['num_queries']),
              str(params['query_pow_bits']), str(output)], check=True)
          subprocess.run(['python3', 'scripts/freeze-multi-asset.py', '--check', str(frozen),
              '--verifier-key', str(output)], check=True)
          PY_PROFILE
      - name: Reproduce all three fixed native relation keys and security reports
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          rustfmt --edition=2024 --check scripts/native-proof-artifacts.rs
          python3 scripts/check-native-proof-profiles.py --check crates/bench-multi-asset/artifacts/v1-native-proof-profiles.json
          python3 scripts/check-native-proof-profiles.py --prepare .local/native-proof-profiles/application
          cargo build --release --locked --manifest-path .local/native-proof-profiles/application/Cargo.toml --features security-report --bin native-proof-artifacts
          cargo test --release --locked --manifest-path .local/native-proof-profiles/application/Cargo.toml --features security-report --bin native-proof-artifacts
          mkdir -p .local/native-proof-profiles/reproduced
          for kind in transaction settlement issuance; do
            "$CARGO_TARGET_DIR/release/native-proof-artifacts" "$kind" ".local/native-proof-profiles/reproduced/$kind.json"
          done
          python3 scripts/check-native-proof-profiles.py --check crates/bench-multi-asset/artifacts/v1-native-proof-profiles.json --reproduced .local/native-proof-profiles/reproduced

  native-runtime:
    name: Native protocol and storage unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RAYON_NUM_THREADS: 4
      SIWORLD_COMPOSITION_HIDING_WORKERS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: crates/native-node
      - name: Acquire locked dependencies
        working-directory: .
        run: bash scripts/ci-fetch.sh native-runtime
      - name: Native runtime format and lints
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          cargo fmt --manifest-path crates/native-node/Cargo.toml --check
          cargo clippy --locked --manifest-path crates/native-node/Cargo.toml --features native-p2p,wallet-light-gateway --all-targets -- -D warnings
      - name: Native protocol, transition, persistence and audit rejection tests
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: cargo test --release --locked --manifest-path crates/native-node/Cargo.toml --features native-p2p,wallet-light-gateway
      - name: Isolated checkpoint alarm scope and retention preservation
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          cargo test --release --locked --manifest-path crates/native-node/Cargo.toml --features native-p2p,wallet-light-gateway,checkpoint-stale-acceptance --lib service::stale_acceptance::tests::
          cargo test --release --locked --manifest-path crates/native-node/Cargo.toml --features native-p2p,wallet-light-gateway,checkpoint-stale-acceptance --lib store::retention_tests::acceptance_finality_observation_preserves_backlog_until_explicit_bounded_probe -- --exact
          cargo test --release --locked --manifest-path crates/native-node/Cargo.toml --features native-p2p,wallet-light-gateway,checkpoint-stale-acceptance --lib checkpoint_stale_runtime::tests::

  wallet:
    name: Wallet and WASM offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned toolchain and WASM target
        run: rustup toolchain install --target wasm32-unknown-unknown
      - name: Acquire locked dependencies
        run: bash scripts/ci-fetch.sh wallet
      - name: Wallet unit and browser tests
        shell: bash --noprofile --norc -c "exec bash \"$GITHUB_WORKSPACE/scripts/ci-offline.sh\" \"$1\"" -- {0}
        run: |
          cargo test --locked --manifest-path crates/native-wallet-core/Cargo.toml
          cargo test --release --locked --manifest-path crates/native-wallet-engine/Cargo.toml
          cargo test --release --locked --manifest-path crates/native-wallet-web/Cargo.toml --lib
          cargo check --locked --target wasm32-unknown-unknown --manifest-path crates/native-wallet-web/Cargo.toml
          node --test crates/native-wallet-web/tests/*.test.mjs
