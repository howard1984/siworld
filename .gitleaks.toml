title = "SIWORLD publication secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Exact public Cargo dependency identifiers, not a credential"
condition = "AND"
paths = ['''(^|/)Cargo\.lock$''']
regexTarget = "match"
regexes = ['''^libcrux-secrets",(?:\s|\\n)*"libcrux-sha3"$''']

[[allowlists]]
description = "Exact published Argon2 and HKDF known-answer fixture"
condition = "AND"
commits = ["d0e14999be6d951e216a30ec4191d207873626fa"]
paths = ['''^crates/sivault-core/vectors/independent\.json$''']
regexTarget = "line"
regexes = ['''^\s*"wrap_key": "c6dac31c331cff4a4271b25e3be35707be35db3233ec9f26b11c0612edd00b72",\s*$''']
