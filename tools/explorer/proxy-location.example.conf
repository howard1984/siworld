# Example inside the existing HTTPS wallet server. Use the installed service's
# configured application origin and upstream; do not expose another listener.
# Static files live under the server's existing document root at /explorer/.
location /explorer/ {
    try_files $uri $uri/ =404;
    # Inherit the existing site's complete response security-header policy.
}

# The reference adapter uses /v1/explorer; production archive routing may use
# /api/v1/explorer instead. Verify the installed adapter before deployment.
location = /chain/eng1/v1/explorer {
    limit_except GET { deny all; }
    proxy_pass http://existing_chain_adapter/v1/explorer;
    proxy_set_header Origin https://wallet.example.invalid;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_buffering on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    # The adapter supplies no-store. Keep the parent's complete security-header
    # policy inherited; a partial local add_header list would suppress it.
}
